<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subject Detail — Chimera Project</title>
  <link rel="stylesheet" href="../../../styles.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-inner">
        <img class="logo" src="../../../img/HPSC.jpeg" alt="HPSC Logo" />
        <div class="hero-copy">
          <p class="eyebrow">The Chimera Project</p>
          <h1>Subject Detail</h1>
          <p id="subtitle">Loading subject…</p>
        </div>
      </div>
      <nav class="hero-nav">
        <a href="../index.html">Dashboard</a>
        <a href="list.html">Subjects</a>
        <a href="../Classifications.html">Classifications</a>
        <a href="../login.html?logout=1">← Logout</a>
      </nav>
    </header>

    <main class="content">
      <section class="projects">
        <div id="subjectDetail">
          <!-- Subject detail rendered here -->
        </div>
      </section>
    </main>

    <footer class="contentinfo">
      <div>
        <p>© 20XX Hero Public Safety Commission - The Chimera Project</p>
      </div>
    </footer>
  </div>

  <script>
    function el(html) {
      const div = document.createElement('div');
      div.innerHTML = html.trim();
      return div.firstChild;
    }

    function makeClassDisplay(rawClass) {
      const rc = String(rawClass || '').trim();
      if (!rc) return {text: '', cls: 'class-default'};
      if (rc.toLowerCase().startsWith('class ')) {
        const letter = rc.split(' ')[1] || rc;
        return { text: `${letter} Class`, cls: 'class-' + String(letter).toUpperCase() };
      }
      return { text: rc + ' Class', cls: 'class-' + rc.replace(/[^A-Za-z0-9]/g, '').toUpperCase() };
    }

    (async function(){
      const container = document.getElementById('subjectDetail');
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) {
        container.innerHTML = '<p style="color:#fdacac;">No subject id provided in the URL.</p><p><a href="list.html">Back to list</a></p>';
        return;
      }

      // Check logged-in session and clearance
      const sessionKey = 'chimeraLoggedInUser';
      const raw = localStorage.getItem(sessionKey);
      if (!raw) {
        container.innerHTML = '<p style="color:#fdacac;">You must be logged in to view subject details.</p><p><a href="../login.html">Go to Login</a></p>';
        return;
      }

      let session = null;
      try {
        session = JSON.parse(raw);
      } catch (e) {
        console.error('Invalid session data', e);
        container.innerHTML = '<p style="color:#fdacac;">Invalid session. Please log in again.</p><p><a href="../login.html">Go to Login</a></p>';
        return;
      }

      try {
        const res = await fetch('../json/subjects.json', {cache: 'no-store'});
        if (!res.ok) throw new Error('Failed to load subjects');
        const list = await res.json();
        const s = list.find(x => String(x.id) === String(id));
        if (!s) {
          container.innerHTML = `<p style="color:#fdacac;">Subject with ID ${id} not found.</p><p><a href="list.html">Back to list</a></p>`;
          return;
        }

        const requiredLevel = Number(s.level || 0);
        const userClearance = Number(session.clearance || 0);

        if (!Array.isArray(session.projectAccess) && typeof session.projectAccess === 'string') {
          session.projectAccess = [session.projectAccess];
        }

        if (!session.projectAccess || !session.projectAccess.includes('Chimera')) {
          container.innerHTML = `<p style="color:#fdacac;">Access denied. Your account does not have access to this project.</p><p><a href="../login.html">Login</a></p>`;
          return;
        }

        if (userClearance < requiredLevel) {
          container.innerHTML = `<p style="color:#fdacac;">Access denied. Your clearance (${userClearance}) is lower than required level ${requiredLevel}.</p><p><a href="list.html">Back to list</a></p>`;
          return;
        }

        const statusClass = 'status-' + String(s.status || '').toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '');
        const classInfo = makeClassDisplay(s.classification);
        const imageSrc = s.image || s.ChimaraImage || '';
        const titleList = Array.isArray(s.ChimaraTitles)
          ? s.ChimaraTitles.filter(Boolean)
          : typeof s.ChimaraTitles === 'string'
            ? s.ChimaraTitles.split(',').map(t => t.trim()).filter(Boolean)
            : [];
        const titleBadges = titleList.length
          ? `<div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;">${titleList.map(title => `<span class="classification-badge" style="background: linear-gradient(90deg,#7c3aed,#4338ca);">${title}</span>`).join('')}</div>`
          : '';
        const notesSection = s.ChimaraNotes ? `
          <div style="margin-top:16px; color:#cbd5e1;">
            <h4 style="margin:0 0 8px; font-size:1rem;">Notes</h4>
            <p style="margin:0; line-height:1.75;">${s.ChimaraNotes}</p>
          </div>
        ` : '';

        // build left image column and right details column
        const imageColumn = imageSrc ? `
          <div style="flex:0 0 320px; max-width:320px;">
            <img src="${imageSrc}" alt="${s.name}" style="width:100%; height:auto; border-radius:8px; display:block;">
          </div>
        ` : '';

        const detailsColumn = `
          <div style="flex:1 1 320px; min-width:220px;">
            <div class="card-heading">
              <h3>${s.name}</h3>
              <div class="card-id">ID: <strong>${s.id}</strong></div>
            </div>
            <div class="card-meta">
              <span class="status-badge ${statusClass}">${s.status || '—'}</span>
              ${classInfo.text ? `<span class="classification-badge ${classInfo.cls}">${classInfo.text}</span>` : ''}
              ${s.level ? `<span class="classification-badge">Level ${s.level}</span>` : ''}
            </div>
            ${titleBadges}
            <div style="margin-top:14px; color:#cbd5e1;">
              <ul style="list-style:none; padding:0; margin:0;">
                ${s.birthdate ? `<li><strong>Birthdate:</strong> ${s.birthdate}</li>` : ''}
                ${s.bloodType ? `<li><strong>Blood Type:</strong> ${s.bloodType}</li>` : ''}
                ${s.hight ? `<li><strong>Height:</strong> ${s.hight}</li>` : ''}
                ${(s.bloodType && (s.quirk || s.quirkdescription)) ? `<li class="detail-sep"><hr></li>` : ''}
                ${s.quirk ? `<li style="margin-bottom:6px;"><strong style="font-size:1rem;">${s.quirk}</strong></li>` : ''}
                ${s.quirkdescription ? `<li>${s.quirkdescription}</li>` : ''}
              </ul>
            </div>
          </div>
        `;

        container.innerHTML = `
          <a href="list.html">← Back to Subjects</a>
          <article class="project-card" style="margin-top:16px;">
            <div style="display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;">
              ${imageColumn}
              ${detailsColumn}
            </div>
            ${notesSection}
          </article>
        `;

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p style="color:#fdacac;">Failed to load subject details. Check console.</p>';
      }
    })();
  </script>
</body>
</html>
