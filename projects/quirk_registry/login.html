<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quirk Registry - Secure Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eef2ff;
      background: #050816;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(71, 125, 255, 0.18), transparent 34%), linear-gradient(180deg, #07122f 0%, #050816 100%);
    }
    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: min(580px, 100%);
      padding: 32px;
      border-radius: 28px;
      background: rgba(11, 19, 44, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
    }
    .login-card h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 4vw, 2.8rem);
      line-height: 1.05;
    }
    .login-card p {
      margin: 0 0 24px;
      color: #c3d2f6;
      line-height: 1.7;
    }
    .field {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    .field label {
      font-size: 0.95rem;
      color: #a9b6e4;
    }
    .field input {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      color: #eef2ff;
      outline: none;
    }
    .field input::placeholder {
      color: #8291bf;
    }
    button {
      width: 100%;
      margin-top: 4px;
      padding: 14px 18px;
      border: none;
      border-radius: 16px;
      background: #4f7dff;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      background: #6b8dff;
    }
    .message {
      min-height: 48px;
      margin: 18px 0 4px;
      font-size: 0.95rem;
      line-height: 1.6;
      border-radius: 14px;
      padding: 14px 16px;
      display: none;
    }
    .message.visible {
      display: block;
    }
    .message.success {
      background: rgba(16, 185, 129, 0.15);
      color: #8df1c7;
      border: 1px solid rgba(16, 185, 129, 0.24);
    }
    .message.error {
      background: rgba(248, 113, 113, 0.12);
      color: #fdacac;
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    .info {
      color: #a9b6e4;
      margin-top: 10px;
    }
    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: #a5b7ff;
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body data-project="quirk-registry">
  <div class="login-shell">
    <div class="login-card">
      <h1>National Quirk Registry</h1>

      <form id="login-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="Username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required />
        </div>

        <button type="submit">Login</button>
      </form>
      <div id="message" class="message" aria-live="polite"></div>
      <a class="back-link" href="../../index.html">← Return to HPSC home</a>
    </div>
  </div>

  <script>
    const loginConfig = {
      credentialsPath: '../../credentials.json',
      currentProject: 'Quirk Registry',
      requiredClearance: 2,
      successRedirect: 'index.html',
      sessionKey: 'quirkRegistryLoggedInUser',
      messages: {
        loadError: 'Unable to read credentials file. Make sure credentials.json exists and the page is served from a web server.',
        missingFields: 'Enter both username and password.',
        invalid: 'Access denied. Credentials do not match.',
        noProjectAccess: project => `Access denied. User does not have access to the ${project} project.`,
        lowClearance: level => `Access denied. Clearance level ${level} is too low.`,
        success: (user, clearance, projects) => `Access granted. Welcome, ${user}. Clearance: ${clearance}. Project access: ${projects}.`
      }
    };

    let credentials = [];

    (function ensureFreshLogin() {
      const params = new URLSearchParams(window.location.search);
      const isLogout = params.has('logout');
      const rawSession = localStorage.getItem(loginConfig.sessionKey);
      if (isLogout) {
        localStorage.removeItem(loginConfig.sessionKey);
        window.history.replaceState({}, '', window.location.pathname);
      }
      if (!rawSession || isLogout) return;
      try {
        JSON.parse(rawSession);
        window.location.href = loginConfig.successRedirect;
      } catch (error) {
        localStorage.removeItem(loginConfig.sessionKey);
      }
    })();

    async function loadCredentials() {
      try {
        const response = await fetch(loginConfig.credentialsPath, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Failed to load credentials (${response.status})`);
        }
        credentials = await response.json();
      } catch (error) {
        showMessage(loginConfig.messages.loadError, 'error');
        console.error(error);
      }
    }

    function findCredential(username, password) {
      return credentials.find(item => item.username === username && item.password === password);
    }

    function showMessage(text, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = text;
      messageEl.className = `error-message visible ${type}`;
    }

    document.getElementById('login-form').addEventListener('submit', event => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showMessage(loginConfig.messages.missingFields, 'error');
        return;
      }

      const matched = findCredential(username, password);
      if (matched) {
        const hasProjectAccess = Array.isArray(matched.projectAccess)
          ? matched.projectAccess.includes(loginConfig.currentProject)
          : matched.projectAccess === loginConfig.currentProject;

        if (!hasProjectAccess) {
          showMessage(loginConfig.messages.noProjectAccess(loginConfig.currentProject), 'error');
          return;
        }

        const clearanceLevel = Number(matched.clearance || 0);
        if (clearanceLevel < loginConfig.requiredClearance) {
          showMessage(loginConfig.messages.lowClearance(loginConfig.requiredClearance), 'error');
          return;
        }

        const projects = Array.isArray(matched.projectAccess) ? matched.projectAccess.join(', ') : matched.projectAccess;
        const userSession = {
          username: matched.username,
          password: matched.password,
          clearance: matched.clearance,
          projectAccess: matched.projectAccess
        };

        localStorage.setItem(loginConfig.sessionKey, JSON.stringify(userSession));
        window.location.href = loginConfig.successRedirect;
      } else {
        showMessage(loginConfig.messages.invalid, 'error');
      }
    });

    loadCredentials();
  </script>
</body>
</html>
