<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MHA Ranking Chart — HPSC</title>
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    .ranking-controls { display:flex; gap:12px; align-items:center; margin-top:12px; }
    .chart-wrap { margin-top:20px; }
    .rank-row { display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:12px; background:rgba(255,255,255,0.02); margin-bottom:10px; }
    .rank-label { width:180px; font-weight:700; color:#e7eefc; }
    .rank-pos { width:36px; color:#9fb0d9; font-weight:700; }
    .bar-outer { flex:1; height:28px; background:rgba(255,255,255,0.03); border-radius:8px; overflow:hidden; }
    .bar-inner { height:100%; border-radius:8px; transition:width 450ms cubic-bezier(.22,.9,.35,1); background:linear-gradient(90deg,#7c3aed,#3b82f6); }
    .score { width:68px; text-align:right; color:#cbd5e1; font-weight:700; }
    .controls-input { background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); color:#cbd5e1; padding:8px 10px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-inner">
        <img class="logo" src="../../img/HPSC.jpeg" alt="HPSC Logo" />
        <div class="hero-copy">
          <p class="eyebrow">Community Charts</p>
          <h1>MHA Ranking Chart</h1>
          <p>Simple interactive ranking of popular MHA characters, styled to match the site.</p>
        </div>
      </div>
      <nav class="hero-nav">
        <a href="../chimara/index.html">Dashboard</a>
        <a href="../../index.html">Home</a>
      </nav>
    </header>

    <main class="content">
      <section class="projects">
        <div class="section-title">
          <h2>Ranking Chart</h2>
          <p>Use the controls to sort and limit results. This is a static demo — replace the data with your own if desired.</p>
        </div>

        <div class="chart-wrap" id="chartWrap">
          <!-- rows rendered here: rank, hero name, real name -->
        </div>

      </section>
    </main>
  </div>

  <script>
    // Sample MHA characters: hero alias and real name (display only)
    const characters = [
      { hero: 'Mirio Togata', real: 'Mirio Togata' },
      { hero: 'Shoto Todoroki', real: 'Shoto Todoroki' },
      { hero: 'Deku', real: 'Izuku Midoriya' },
      { hero: 'Great Explosion Murder God Dynamight', real: 'Katsuki Bakugo' },
      { hero: 'Mt. Lady', real: 'Yu Takeyama' },
      { hero: 'Gemsteel', real: 'Reiko Kuroda' },
      { hero: 'Best Jeanist', real: 'Tsunagu Hakamada' },
      { hero: 'Mirko', real: 'Rumi Usagiyama' },
      { hero: 'Nejire Chan', real: 'Nejire Hado' },
      { hero: 'Kamui Woods', real: 'Shinji Nishiya' },
      { hero: 'Wash', real: 'Susugu Mitarai' },
      { hero: 'Ryukyu', real: 'Ryuko Tatsuma' },
      { hero: 'Edgeshot', real: 'Shinya Kamihara' },
      { hero: 'Fat Gum', real: 'Taishiro Toyomitsu' },
      { hero: 'Eraser Head', real: 'Shota Aizawa' },
      { hero: 'Ms. Joke', real: 'Emi Fukukado' },
      { hero: 'Rock Lock', real: 'Ken Takagi' },
      { hero: 'Sirius', real: 'Kaoruko Awata' },
      { hero: 'Death Arms', real: '__________' },
      { hero: 'Gang Orca', real: 'Kugo Sakamata' },
      { hero: 'Cementoss', real: 'Ken Ishiyama' },
      { hero: 'Present Mic', real: 'Hizashi Yamada' },
      { hero: 'Ectoplasm', real: '__________' },
      { hero: 'Manual', real: '__________' },

      { hero: 'Creati', real: 'Momo Yaoyorozu' },
      { hero: 'Tsukuyomi', real: 'Fumikage Tokoyami' },
      { hero: 'Ingenium', real: 'Tenya Iida' },
      { hero: 'Uravity', real: 'Ochaco Uraraka' },
      { hero: 'Red Riot', real: 'Eijiro Kirishima ' },
      { hero: 'Chargebolt', real: 'Denki Kaminari' },
      { hero: 'Earphone Jack', real: 'Kyoka Jiro' },
      { hero: 'Froppy', real: 'Tsuyu Asui' },
      { hero: 'Tentacole', real: 'Mezo Shoji' },
      { hero: 'Cellophane', real: 'Hanta Sero' },
      { hero: 'Pinky', real: 'Mina Ashido' },
      { hero: 'tailman', real: 'Mashirao Ojiro' },
      { hero: 'Anima', real: 'Koji Koda' },
      { hero: 'NightHide', real: 'Hitoshi Shinso' },
      { hero: 'Phantom Theif', real: 'Neito Monoma' },
      { hero: 'Battle Fist', real: 'Itsuka Kendo' },
      { hero: 'Real Steel', real: 'Tetsutetsu Tetsutetsu' },
      { hero: 'Illus-o-Camie', real: 'Camie Utsushimi' },
      { hero: 'Shishikross', real: 'Seiji Shishikura' },
      { hero: 'Chewyee', real: 'Nagamasa Mora' },
      { hero: 'Grand', real: 'Yo Shindo' },
      { hero: 'Turtle Neck', real: 'Tatami Nakagame' },
      { hero: 'Long Weizi', real: 'Hiryu Rin' }
    ];

    const chartWrap = document.getElementById('chartWrap');

    function render() {
      chartWrap.innerHTML = '';
      characters.forEach((c, idx) => {
        const row = document.createElement('div');
        row.className = 'rank-row';
        row.innerHTML = `
          <div class="rank-pos">${idx+1}</div>
          <div class="rank-label">${c.hero}</div>
          <div style="width:1px"></div>
          <div class="score" style="width:260px; text-align:left; color:#9fb0d9; font-weight:600">${c.real}</div>
        `;
        chartWrap.appendChild(row);
      });
    }

    render();
  </script>
</body>
</html>
